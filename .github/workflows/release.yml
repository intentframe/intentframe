name: Release (packages/ → PyPI)

# Manual-only. Trigger from the Actions tab ("Run workflow"), choose target,
# package group, and confirm. Nothing publishes automatically on push or tag.
#
# Full docs: scripts/release/README.md (PyPI 429 limits, dist/publish vs dist/upload).
# GitHub release wheels (optional mirror): scripts/github-release/README.md
# First-time production PyPI (historical): groups 1 → 2 → 3 — all 18 names exist for 0.1.0.
# Subsequent version bumps: group=all or publish.py --all is usually fine.
# Build validates all 18 packages; publish uploads only the staged group in dist/upload/.
# Re-runs are safe: skip-existing ignores already-uploaded files.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        required: true
        default: testpypi
        options:
          - testpypi
          - pypi
      group:
        description: "Package group to upload (use 1/2/3 for new PyPI projects)"
        type: choice
        required: true
        default: all
        options:
          - all
          - "1"
          - "2"
          - "3"
      version:
        description: "Expected version (must match packages/, e.g. 0.1.1)"
        type: string
        required: true
      confirm:
        description: 'Type "publish" to confirm upload'
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Verify lockstep version pins match requested version
        run: python3 scripts/release/set_version.py "${{ inputs.version }}" --check

      - name: Build, twine check, clean-room install
        run: bash scripts/release/validate_publish.sh

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-publish
          path: dist/publish/
          if-no-files-found: error

  publish:
    name: Publish group ${{ inputs.group }} → ${{ inputs.target }}
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'publish' }}
    environment: ${{ inputs.target }}
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist-publish
          path: dist/publish

      # Self-contained: groups are defined here in the workflow. The local
      # scripts/release/publish.py keeps its own copy for terminal use; the two
      # are intentionally independent. Keep the buckets in sync if they change.
      - name: Stage upload group
        run: |
          set -euo pipefail
          mkdir -p dist/upload
          case "${{ inputs.group }}" in
            all)
              cp dist/publish/* dist/upload/
              ;;
            1)
              names="intentframe_core intentframe_policy_registry command_shield intentframe_prompt_library intentframe_bundle_sdk intentframe_executor_sdk"
              ;;
            2)
              names="intentframe_executor_client intentframe_credentials intentframe_client intentframe_actor intentframe_components intentframe_executor"
              ;;
            3)
              names="intentframe_server intentframe_runtime intentframe_supervisor intentframe_native_kit intentframe_proxy intentframe_edge"
              ;;
            *)
              echo "unknown group: ${{ inputs.group }}" >&2; exit 1 ;;
          esac
          if [ "${{ inputs.group }}" != "all" ]; then
            for n in ${names}; do
              # trailing hyphen avoids prefix collisions
              # (intentframe_executor- vs intentframe_executor_sdk-)
              cp dist/publish/"${n}"-*.whl dist/publish/"${n}"-*.tar.gz dist/upload/
            done
          fi
          echo "staged $(ls dist/upload | wc -l) file(s) for group ${{ inputs.group }}:"
          ls dist/upload

      - name: Publish to TestPyPI
        if: ${{ inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/upload
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true

      - name: Publish to PyPI
        if: ${{ inputs.target == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/upload
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
