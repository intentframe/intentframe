# ═══════════════════════════════════════════════════════════════════════════════
# Root-Demo Test Policy
# ═══════════════════════════════════════════════════════════════════════════════
#
# Scoped mirror of the Jarvis root profile that the gateway seeds in
# ``intentframe_gateway/bootstrap.py::_build_policy("root")``.  Two things
# differ from the gateway seed on purpose:
#
#   1. The action set is trimmed to ``RUN_COMMAND`` only -- root operations
#      on a real computer are shell operations (``cat /etc/sudoers``,
#      ``tee /var/root/...``, ``ls /var/db/sudo``), so the demo grants only
#      the action that's actually used at root.  The other adapters
#      (host-file, mail, calendar, ...) target the operator's own user
#      space and aren't part of the root surface; they also wouldn't
#      escalate even if granted, because ``sandbox.escalate: sudo`` only
#      flows through the sandbox engine, which only wraps RUN_COMMAND.
#      See ``docs/executor-root-mode.md`` -- "Why this shape exists".
#   2. ``intent_limits`` is empty -- spend / deletion limits are irrelevant
#      to the root-demo attack corpus.
#
# Constraint values that DO carry over (and must stay in sync with
# ``bootstrap.py`` if it changes):
#
#   * terminal_constraint.blocked_patterns                        (bootstrap.py SYSTEM patterns)
#   * terminal_constraint.deny_capabilities                       (bootstrap.py PYTHON_SHELL_ONLY_DENY_CAPABILITIES)
#   * safe / unsafe classification per action                     (bootstrap.py SAFE_ACTIONS / UNSAFE_ACTIONS)
#
# ``sudo`` stays in ``blocked_patterns`` even though the demo runs as root --
# the demo claim is "executor already runs as root, agents must not attempt
# escalation", which only holds if ``sudo`` is rejected upstream.
#
# ``deny_capabilities`` mirrors the language clamp every gateway profile
# seeds in ``intentframe_gateway/bootstrap.py``: ``RUN_COMMAND`` is
# constrained to a python + shell language surface regardless of whether
# the executor runs as user or root.  Every other scripting interpreter,
# build/link toolchain, and non-pip/non-shell package install is denied
# at Gate 2 before any LLM runs.  Tag suffixes mirror what
# ``command_shield.classifier._SCRIPT_EXECUTION_RULES`` emits; the
# contract is pinned by
# ``tests/test_python_shell_only_policy.py::TestClassifierAgreesWithPolicy``.
# ═══════════════════════════════════════════════════════════════════════════════

allowed_actions:
  RUN_COMMAND:
    safe: false
    constraints:
      blocked_patterns:
        - sudo
        - "rm -rf /"
        - mkfs
        - "dd if="
        - "> /dev/"
        - "chmod 777"

intent_limits: []
