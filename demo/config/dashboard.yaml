# ═══════════════════════════════════════════════════════════════════════════════
# Demo Dashboard Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# Declares users, workspaces, and tasks for the demo run.
# The dashboard reads this, seeds the registries, installs the agents
# referenced by tasks, and executes each task in order.
#
# Policy keying — read this before adding a second task
# ─────────────────────────────────────────────────────
# The policy registry keys on the (user_id, agent_id) pair so one
# operator can run multiple agents with isolated policies.  This file
# only declares per-user policy blocks; the dashboard derives the
# agent_id side of the key from ``tasks[].agent`` and registers one
# slot per (user, agent) pair it finds — every slot for a given user
# gets the *same* policy from ``users[<user>]``.  If you want
# per-agent variation under one user (e.g. a tighter policy for a
# less-trusted agent), register them programmatically via
# ``IntentFrameDashboard.register_user(user_id=..., agent_id=...)``;
# this YAML schema does not (yet) express that.
#
# Policy has two layers — defense in depth:
#
#   allowed_actions  — Deterministic. Which actions the agent can use, with
#                      optional per-category constraints (paths, amounts, etc.).
#                      Present = ALLOWED, absent = BLOCKED (deny-by-default).
#                      safe: true → fast-path (code-only) validation.
#                      These are hard gates that run BEFORE AI and cannot
#                      be reasoned around.
#
#   intent_limits    — AI-evaluated. Cross-cutting semantic restrictions that
#                      apply regardless of action type. The AI Guardian reads
#                      these when reasoning about an intent.
#
# When both layers cover the same thing (e.g. $5k spending), that's
# defense in depth, not duplication — the deterministic check catches
# known action types cheaply, the semantic limit catches everything else.
#
# Usage:
#   python demo/demo_dashboard.py
# ═══════════════════════════════════════════════════════════════════════════════

users:
  finance_001:
    allowed_actions:
      READ_FILE:
        safe: true
        constraints:
          allowed_paths:
            - /invoices/
            - /expense_tracker.md
      LIST_DIRECTORY:
        safe: true
        constraints:
          allowed_paths:
            - /invoices/
      ASK_USER:
        safe: false
      SHOW_MESSAGE:
        safe: false
      GET_CONFIRMATION:
        safe: false
      APPEND_ROW:
        safe: false
        constraints:
          allowed_paths:
            - /expense_tracker.md
      PAY_INVOICE:
        safe: false
        constraints:
          max_amount: 5000.0
      SEND_EMAIL:
        safe: false

    # Domain constraints — deterministic structural enforcement.
    # These are hard gates that run BEFORE AI and cannot be reasoned around.
    # Domain modules can BLOCK on structural violations but never ALLOW.
    domain_constraints:
      finance:
        max_amount: 5000.0
        allowed_currencies: ["USD"]
      deletion:
        require_confirmation: true
        block_irreversible: true

    # Cross-cutting semantic restrictions — evaluated by AI Guardian.
    # These apply regardless of action type. The AI understands the intent
    # and checks it against these limits.
    intent_limits:
      - limit_id: max-spend-per-txn
        domain: spending
        description: "Maximum $5,000 per transaction"
        raw: "Don't spend more than 5k on a single thing"
        threshold: 5000.0
        effect: block

      - limit_id: confirm-before-delete
        domain: deletion
        description: "Always confirm before deleting"
        raw: "Ask me before deleting anything I can't get back"
        effect: require_confirmation

    metadata:
      profile: demo-finance

workspaces:
  invoice_processing:
    base_path: demo
    mounts:
      - virtual_path: /invoices/
        real_path: demo_data
        file_filter: "*.md"
      - virtual_path: /expense_tracker.md
        real_path: demo_data/expense_tracker.md
        writable: true

tasks:
  - description: "Process the new invoices and update expense tracker"
    agent: invoice_bot
    user: finance_001
    workspace: invoice_processing
    timeout: 1800.0
