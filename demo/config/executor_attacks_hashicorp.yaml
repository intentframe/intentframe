# ═══════════════════════════════════════════════════════════════════════════════
# Demo Executor Configuration — attack tests, HashiCorp / containerized runtime
# ═══════════════════════════════════════════════════════════════════════════════
#
# Use this config when running the invoice attack suites against the container:
#   test_attacks.py, test_advanced_attacks.py, test_redteam_attacks.py
#
# The only difference from executor_hashicorp.yaml is the /invoices/ mount:
# it points at demo_data/attack_invoices_sandbox (populated per-attack by
# invoice_attack_pipeline.populate_attack_sandbox()) rather than demo_data.
# This must match the workspace registered by register_attack_workspace().
#
# In the container, set this before `up`:
#   export EXECUTOR_CONFIG=demo/config/executor_attacks_hashicorp.yaml
#
# IMPORTANT — credentials.backend stays `service`:
#   Same rationale as executor_hashicorp.yaml — the executor talks to the
#   credential-vault service over UDS; only the vault service talks HashiCorp.
# ═══════════════════════════════════════════════════════════════════════════════

platform: auto

transport:
  type: unix_socket
  options:
    socket_path: /tmp/intentframe/executor.sock

auth:
  type: guardian_hmac
  options:
    secret_key: "intentframe_demo_secret_key_do_not_use_in_production"

credentials:
  backend: service
  options: {}

worker_pool:
  max_workers: 4
  default_timeout_seconds: 30.0

adapters:
  enabled:
    - files
    - user_io

pack_options:
  files:
    base_path: demo
    mounts:
      # Sandbox directory populated per-attack by invoice_attack_pipeline.py.
      # Mirrors register_attack_workspace() in demo/tests/invoice_attack_pipeline.py.
      - virtual_path: "/invoices/"
        real_path: "demo_data/attack_invoices_sandbox"
        file_filter: "*.md"
      - virtual_path: "/expense_tracker.md"
        real_path: "demo_data/expense_tracker.md"
        writable: true

  host_files:
    allowed_read_paths: []
    allowed_write_paths: []

storage:
  database_path: null
  log_path: null

logging:
  level: INFO
  format: console
