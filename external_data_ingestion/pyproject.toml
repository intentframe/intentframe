[project]
name = "email-sync-service"
version = "0.1.0"
description = "Background email sync daemon with IMAP IDLE and a direct-read SQLite client library"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
authors = [
    { name = "IntentFrame Contributors" },
]
dependencies = [
    "imap-tools>=1.7.0",
    "aiosqlite>=0.21",
    "aiosmtplib>=3.0.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
    "intentframe-credentials",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
email-sync-daemon = "external_data_ingestion.email.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["external_data_ingestion"]
