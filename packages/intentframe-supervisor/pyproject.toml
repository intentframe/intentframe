[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intentframe-supervisor"
version = "0.1.0"
description = "IntentFrame supervisor — process manager that spawns the runtime service graph"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "IntentFrame Contributors" }]
keywords = ["ai", "agents", "security", "intentframe", "supervisor", "runtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "intentframe-runtime",       # the 3-process substrate it spawns
    "pydantic>=2.12.5",          # config.py schema
    "pyyaml>=6.0.3",             # profile loading
    "httpx>=0.28.1",             # health.py UDS polling
    "uvicorn[standard]",         # services spawned as `python -m uvicorn`
]

[project.optional-dependencies]
# The "native" flavour. Adds intentframe-native-kit, which provides the
# resource-registry service module (intentframe_native_kit.resource_registry.server:app)
# and the 4-service kit profile (kit supervisor profile in the installed package).
#
# Flavor selection stays purely config-driven: point --config /
# INTENTFRAME_SUPERVISOR_CONFIG at the kit profile to start the resource-registry.
# The supervisor itself never imports or auto-detects native-kit — installing this
# extra only makes the module + profile present so the chosen profile can run.
native = ["intentframe-native-kit"]

[project.urls]
Homepage = "https://github.com/intentframe/intentframe"
Repository = "https://github.com/intentframe/intentframe"
Issues = "https://github.com/intentframe/intentframe/issues"

[project.scripts]
intentframe = "supervisor.main:main"
intentframe-backend = "supervisor.main:backend_main"

# Ships the supervisor package, including its default service-graph YAML
# (supervisor/config/supervisor.yaml) — hatchling includes non-Python files
# under the package directory automatically.
[tool.hatch.build.targets.wheel]
packages = ["supervisor"]
