[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intentframe-policy-registry"
version = "0.1.0"
description = "IntentFrame policy models, registry service, and YAML seed loader"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "IntentFrame Contributors" }]
keywords = ["ai", "agents", "security", "policy", "intentframe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "intentframe-core",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "fastapi",
    "uvicorn[standard]",
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/intentframe/intentframe"
Repository = "https://github.com/intentframe/intentframe"
Issues = "https://github.com/intentframe/intentframe/issues"

[tool.hatch.build.targets.wheel]
packages = ["policy_registry"]
