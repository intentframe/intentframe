[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intentframe-prompt-library"
version = "0.1.1"
description = "Default system instructions (analysis engine, guardian) for the IntentFrame policy pipeline"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "IntentFrame Contributors" }]
keywords = ["ai", "agents", "security", "intentframe", "prompts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/intentframe/intentframe"
Repository = "https://github.com/intentframe/intentframe"
Issues = "https://github.com/intentframe/intentframe/issues"

[tool.hatch.build.targets.wheel]
packages = ["intentframe_prompt_library"]
