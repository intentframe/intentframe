[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intentframe-client"
version = "0.1.0"
description = "Neutral HTTP/UDS transport client for the IntentFrame Core service"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "IntentFrame Contributors" }]
keywords = ["ai", "agents", "security", "intentframe", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "intentframe-core",
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/intentframe/intentframe"
Repository = "https://github.com/intentframe/intentframe"
Issues = "https://github.com/intentframe/intentframe/issues"

[tool.hatch.build.targets.wheel]
packages = ["intentframe_client"]
