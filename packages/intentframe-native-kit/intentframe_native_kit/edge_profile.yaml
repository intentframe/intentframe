# ═══════════════════════════════════════════════════════════════════════════════
# IntentFrame Native Kit — first-party edge profile
# ═══════════════════════════════════════════════════════════════════════════════
#
# The batteries-included edge backend set for first-party IntentFrame products
# and the test harnesses. It adds the resource-registry `/workspaces` route on
# top of the substrate backends so remote clients (ResourceRegistryClient with
# INTENTFRAME_RESOURCE_URL, the dashboard, attack/redteam suites) can create and
# resolve workspaces through the edge.
#
# Select it explicitly (mirrors the supervisor profile):
#
#   INTENTFRAME_EDGE_CONFIG=/app/packages/intentframe-native-kit/intentframe_native_kit/edge_profile.yaml \
#     python -m intentframe_edge
#   # or: KIT="$(uv run python -c 'import intentframe_native_kit as k, pathlib; print(pathlib.Path(k.__file__).parent)')"
python -m intentframe_edge --config "${KIT}/edge_profile.yaml"
#
# The edge's own default (intentframe_edge/config.py::DEFAULT_BACKENDS) exposes
# only policy-registry + intentframe-server; this kit-owned profile is the opt-in
# that turns on /workspaces. Pair it with the supervisor kit profile so the
# resource-registry service is actually running behind the route.
#
# Network fields (host/port/TLS/auth) are intentionally omitted here — they stay
# env-driven (INTENTFRAME_EDGE_HOST / _PORT / _TLS_* / _TOKEN) so one profile
# works across deployments. Executor and credential-vault are never exposed.
# ═══════════════════════════════════════════════════════════════════════════════

backends:
  - name: policy-registry
    socket_name: policy-registry.sock
    upstream_host: policy-registry
    prefixes:
      - /policies

  - name: resource-registry
    socket_name: resource-registry.sock
    upstream_host: resource-registry
    prefixes:
      - /workspaces

  - name: intentframe-server
    socket_name: intentframe.sock
    upstream_host: intentframe
    prefixes:
      - /handshake
      - /process
      - /audit
