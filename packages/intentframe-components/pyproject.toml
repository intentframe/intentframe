[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intentframe-components"
version = "0.1.0"
description = "IntentFrame pipeline engines — analysis, guardian, onboarding, and prompt hardening"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
authors = [{ name = "IntentFrame Contributors" }]
keywords = ["ai", "agents", "security", "intentframe", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "intentframe-core",
    "intentframe-bundle-sdk",
    "intentframe-policy-registry",
    "intentframe-prompt-library",
    "openai-agents>=0.7.0",
    "pydantic>=2.12.5",
]

[project.urls]
Homepage = "https://github.com/intentframe/intentframe"
Repository = "https://github.com/intentframe/intentframe"
Issues = "https://github.com/intentframe/intentframe/issues"

[tool.hatch.build.targets.wheel]
packages = ["intentframe_components"]
exclude = ["intentframe_components/TODO"]
