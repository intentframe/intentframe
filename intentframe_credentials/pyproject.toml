[project]
name = "intentframe-credentials"
version = "0.1.0"
description = "Internal credential vault for IntentFrame — OS keyring-backed secret storage with UDS service API"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
authors = [
    { name = "IntentFrame Contributors" },
]
dependencies = [
    "pydantic>=2.12.5",
    "keyring",
    "httpx>=0.28.1",
    "fastapi",
    "uvicorn[standard]",
    "structlog>=25.5.0",
    "aiosqlite>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intentframe_credentials"]
