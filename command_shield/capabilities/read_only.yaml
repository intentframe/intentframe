  mitre_family: discovery
- id: read_only__filesystem_list__2
  family: read_only
  suffix: filesystem_list
  pattern: \Afind(?!.*\s-(?:delete|exec|execdir|ok|okdir|fprint|fprintf|fls)\b)(?:\s+[^\s]+)*\s*\Z
  description: Read-only filesystem_list command
  mitre_family: discovery
- id: read_only__filesystem_read
