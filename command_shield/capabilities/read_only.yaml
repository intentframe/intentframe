  pattern: \A(?:cat|head|tail|less|more|wc|hexdump|xxd|od|nl|tac|rev|md5sum|sha1sum|sha224sum|sha256sum|sha384sum|sha512sum|b2sum|shasum|cksum|sum)(?:\s+-{1,2}[A-Za-z0-9][A-Za-z0-9\-]*(?:=\S+)?)*(?:\s+[^\s]+)+\s*\Z
