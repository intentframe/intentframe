[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intentframe"
version = "0.1.0"
description = "Security gateway for AI agents — every action goes through a policy pipeline before touching the real world"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
authors = [
    { name = "IntentFrame Contributors" },
]
keywords = ["ai", "agents", "security", "guardrails", "policy", "oversight"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "fastapi",
    "httpx>=0.28.1",
    "keyring; sys_platform == 'darwin'",
    "openai-agents>=0.7.0",
    "pydantic>=2.12.5",
    "pyobjc-framework-EventKit>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-Contacts>=11.0; sys_platform == 'darwin'",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "trafilatura>=1.12.0",
    "uvicorn[standard]",
    "aiosqlite>=0.21",
    "sse-starlette>=2.0",
    "websockets>=14.0",
    "bashlex>=0.18",
    "pymupdf",
    "jarvis-pa",
    "email-sync-service",
    "intentframe-credentials",
    "jarvis-telegram",
    "prompt-toolkit>=3.0",
    "rich>=13.0",
    # Split workspace distributions (foundation + SDKs), see packages/
    "intentframe-core",
    "intentframe-policy-registry",
    "intentframe-client",
    "intentframe-actor",
    "intentframe-bundle-sdk",
    "intentframe-executor-sdk",
    "command-shield",
    # Split workspace distributions (runtime layer), see packages/
    "intentframe-prompt-library",
    "intentframe-components",
    "intentframe-executor-client",
    "intentframe-executor",
    "intentframe-server",
    "intentframe-runtime",
    "intentframe-supervisor[native]",
    "intentframe-native-kit",
    "intentframe-proxy",
    "intentframe-edge",
]

[project.optional-dependencies]
# Headless/cloud credential storage. Activates the intentframe-credentials
# workspace member's `hashicorp` extra (hvac) so `uv sync --extra hashicorp`
# pulls it in. Off by default so laptop/consumer installs stay lean.
hashicorp = ["intentframe-credentials[hashicorp]"]

[project.urls]
Homepage = "https://github.com/intentframe/intentframe"
Repository = "https://github.com/intentframe/intentframe"
Issues = "https://github.com/intentframe/intentframe/issues"

# NOTE: the intentframe.executor_packs and intentframe.bundles entry points
# now live in the intentframe-native-kit distribution under packages/, which
# owns those modules and advertises them on install.

[tool.setuptools.packages.find]
where = ["."]
# NOTE: intentframe_core, policy_registry, intentframe_client, intentframe_actor,
# intentframe_bundle_sdk, executor_sdk, command_shield, intentframe_prompt_library,
# intentframe_components, executor_client, executor, intentframe_server,
# intentframe_native_kit, intentframe_proxy, intentframe_edge, intentframe_credentials,
# and the supervisor (now intentframe-supervisor) ship as separate workspace distributions
# under packages/ and are pulled in as dependencies above.
include = [
    "intentframe_dashboard*",
    "intentframe_gateway*",
    "intentframe_cli*",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
# `intentframe` / `intentframe-backend` are owned by the intentframe-supervisor
# distribution (packages/intentframe-supervisor) and reach PATH via that dep.
intentframe-gateway-cli = "intentframe_cli.main:main"
intentframe-gateway-backend = "intentframe_gateway.entry:backend_main"


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.uv.workspace]
members = [
    "packages/intentframe-core",
    "packages/policy-registry",
    "packages/intentframe-client",
    "packages/intentframe-actor",
    "packages/intentframe-bundle-sdk",
    "packages/executor-sdk",
    "packages/command-shield",
    "packages/intentframe-prompt-library",
    "packages/intentframe-components",
    "packages/executor-client",
    "packages/executor",
    "packages/intentframe-server",
    "packages/intentframe-runtime",
    "packages/intentframe-supervisor",
    "packages/intentframe-native-kit",
    "packages/intentframe-proxy",
    "packages/intentframe-edge",
    "jarvis_pa",
    "external_data_ingestion",
    "packages/intentframe-credentials",
    "jarvis_telegram",
]

[tool.uv.sources]
jarvis-pa = { workspace = true }
email-sync-service = { workspace = true }
intentframe-credentials = { workspace = true }
jarvis-telegram = { workspace = true }
intentframe-core = { workspace = true }
intentframe-policy-registry = { workspace = true }
intentframe-client = { workspace = true }
intentframe-actor = { workspace = true }
intentframe-bundle-sdk = { workspace = true }
intentframe-executor-sdk = { workspace = true }
command-shield = { workspace = true }
intentframe-prompt-library = { workspace = true }
intentframe-components = { workspace = true }
intentframe-executor-client = { workspace = true }
intentframe-executor = { workspace = true }
intentframe-server = { workspace = true }
intentframe-runtime = { workspace = true }
intentframe-supervisor = { workspace = true }
intentframe-native-kit = { workspace = true }
intentframe-proxy = { workspace = true }
intentframe-edge = { workspace = true }

[tool.uv]
default-groups = ["dev"]
override-dependencies = [
    "requests>=2.31",
]
