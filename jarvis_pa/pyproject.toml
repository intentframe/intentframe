[project]
name = "jarvis-pa"
version = "0.1.0"
description = "Jarvis – a standalone local only personal assistant powered by LLM reasoning"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
authors = [
    { name = "IntentFrame Contributors" },
]
dependencies = [
    # Agent core
    "openai-agents>=0.7.0",
    "openai>=1.0.0",

    # M1: Config, prompts, REPL, logging, model routing
    "pydantic-settings>=2.0",
    "pydantic>=2.0",
    "Jinja2>=3.0",
    "tiktoken>=0.7",
    "prompt-toolkit>=3.0",
    "rich>=14.0",
    "loguru>=0.7",
    "litellm>=1.0.0",

    # M3: Memory indexing and search
    "sqlite-vec>=0.1.0",
    "chonkie[tiktoken]==1.5.6",
    "xxhash>=3.0",
    "watchfiles>=1.0",

    # M4: Skills
    "python-frontmatter>=1.0",

    # M5: Heartbeat
    "desktop-notifier>=6.0",
    "diskcache>=5.6",

    # API server
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette>=2.0",

    # Server-backed CLI (HTTP over UDS)
    "httpx>=0.28.1",

    # Utilities
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
jarvis = "jarvis.main:cli"
jarvis-cli-client = "jarvis.server_cli:cli"
jarvis-server = "jarvis.server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages = ["jarvis"]` includes the entire `jarvis/` tree, so the
# built-in policy YAMLs at `jarvis/policies/*.yaml` ship inside the
# wheel and can be located via `jarvis.policies.builtin_policy_path()`
# regardless of install layout.
packages = ["jarvis"]
