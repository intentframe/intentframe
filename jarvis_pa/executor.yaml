# ═══════════════════════════════════════════════════════════════════════════════
# Jarvis PA — Executor Configuration
#
# Jarvis-specific executor config with all adapters Jarvis needs enabled.
# Usage:
#   EXECUTOR_CONFIG=jarvis_pa/executor.yaml python -m supervisor.main start
# ═══════════════════════════════════════════════════════════════════════════════

transport:
  type: unix_socket
  options:
    socket_path: /tmp/intentframe/executor.sock

auth:
  type: guardian_hmac
  options:
    secret_key: "intentframe_demo_secret_key_do_not_use_in_production"

credentials:
  backend: service
  options: {}

worker_pool:
  max_workers: 4
  default_timeout_seconds: 30.0

# ─── Adapters Jarvis uses ─────────────────────────────────────────────────────
adapters:
  enabled:
    - files
    - host_files
    - terminal
    - user_io
    - mail
    - calendar
    - contacts
    - notes
    - reminders
    - browser
    - messages
    - notifications
    - system
    - clipboard
    - spotlight
    - http_api

# ─── Executor pack options ───────────────────────────────────────────────────
# Opaque config slices owned and validated by executor packs.
pack_options:
  # VFS mount table for the files adapter.
  # Agent sees /home/ — never learns the real path (/Users/username/, C:\Users\...).
  # The VFS translates /home/ → ~ at runtime via expand_path().
  # Cloud-synced folders (iCloud, Dropbox, Google Drive) appear as local
  # directories under /home/ so no cloud API is needed.
  # Mirrors WORKSPACE_MOUNTS in intentframe_gateway/bootstrap.py.
  files:
    mounts:
      - virtual_path: /home/
        real_path: ~/
        writable: true
  # Real-path allowlist for host-file tools.
  # Keep this in sync with the host-file ``allowed_host_paths`` declared in
  # ``jarvis_pa/jarvis/policies/jarvis.yaml`` (the runtime policy seed).
  # Pinned by ``tests/test_jarvis_host_scope_mirror.py``.
  host_files:
    allowed_read_paths:
      - ~/
    allowed_write_paths:
      - ~/

  # Kernel-enforced sandbox for shell commands (macOS Seatbelt / sandbox-exec).
  # All commands run under the highest-privilege template in allowed_templates.
  sandbox:
    enabled: true
    working_directory: ~/
    allowed_write_paths:
      - ~/
    allowed_templates:
      - pure_compute
      - file_read_only
      - file_read_write
      - network_outbound

storage:
  database_path: null
  log_path: null

logging:
  level: INFO
  format: console
