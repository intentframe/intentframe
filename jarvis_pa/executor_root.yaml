# ═══════════════════════════════════════════════════════════════════════════════
# Jarvis PA — Executor Configuration (root profile)
#
# Root-scoped variant of ``jarvis_pa/executor.yaml``.  Used when the gateway
# is started under the root-mode Jarvis variant (``intentframe-gateway-cli
# --profile root`` → ``JARVIS_VARIANT=root`` + ``EXECUTOR_CONFIG=jarvis_pa/executor_root.yaml``).
#
# Only three things differ from the default profile:
#
#   1. ``pack_options.host_files.allowed_{read,write}_paths`` broadened to ``/``.
#   2. ``filesystem.mounts`` exposes the real root as the virtual root.
#   3. ``pack_options.sandbox`` targets ``/`` and lists the ``unrestricted`` template.
#
# Everything else (transport, auth, credentials, worker pool, adapter set,
# storage, logging) is intentionally identical to the default executor.yaml
# so the two profiles share one mental model.
#
# Important: broadening the allow-lists here does NOT disable the
# non-negotiable deny base enforced by the sandbox templates and
# ``resource_registry/floor.py`` (LaunchAgents, /etc, sshd_config,
# sudoers, PAM, kexts, Keychains, Messages, Mail, ~/.ssh, ~/.gnupg,
# shell rc files, etc.) — those gates still apply under every template,
# including ``unrestricted``.
#
# Usage (supervisor only — see docs/executor-root-mode.md section 2a):
#   JARVIS_VARIANT=root \
#   EXECUTOR_CONFIG=jarvis_pa/executor_root.yaml \
#   INTENTFRAME_ESCALATION_ARMED=1 \
#   python -m supervisor.main start
# ═══════════════════════════════════════════════════════════════════════════════

transport:
  type: unix_socket
  options:
    socket_path: /tmp/intentframe/executor.sock

auth:
  type: guardian_hmac
  options:
    secret_key: "intentframe_demo_secret_key_do_not_use_in_production"

credentials:
  backend: service
  options: {}

worker_pool:
  max_workers: 4
  default_timeout_seconds: 30.0

# ─── Adapters Jarvis uses ─────────────────────────────────────────────────────
adapters:
  enabled:
    - files
    - host_files
    - terminal
    - user_io
    - mail
    - calendar
    - contacts
    - notes
    - reminders
    - browser
    - messages
    - notifications
    - system
    - clipboard
    - spotlight
    - http_api

# ─── Executor pack options (root profile) ────────────────────────────────────
# Opaque config slices owned and validated by executor packs.
pack_options:
  # VFS mount table for the files adapter (root profile).
  # The virtual root and real root coincide so the agent sees the same path
  # shape the operator does.  VFS path-resolution, floor checks, and the
  # pack sandbox write scope all line up against ``/`` as the workspace root.
  # Mirrors ROOT_WORKSPACE_MOUNTS in intentframe_gateway/bootstrap.py.
  files:
    mounts:
      - virtual_path: /
        real_path: /
        writable: true
  # Real-path allowlist for host-file tools. Broadened to ``/`` so the
  # root-profile agent can operate on system paths. The non-negotiable
  # deny base in ``resource_registry/floor.py`` still protects LaunchAgents,
  # /etc sensitive files, sudoers, sshd_config, PAM, kexts, Keychains,
  # Messages, Mail, ~/.ssh, ~/.gnupg, and shell rc files regardless of what
  # this allow-list says.
  # Keep this mirror in sync with the host-file ``allowed_host_paths``
  # declared in ``jarvis_pa/jarvis/policies/jarvis_root.yaml`` (the runtime
  # policy seed for the root-mode Jarvis variant).
  host_files:
    allowed_read_paths:
      - /
    allowed_write_paths:
      - /

  # ``unrestricted`` is listed so the planner can pick it when the root-profile
  # demo runs admin-style commands (``cat /etc/hosts``, ``ls /``, log
  # inspection). The two non-negotiable deny lists enforced on every
  # template (including ``unrestricted``) still block IntentFrame internals,
  # raw device writes, and the root-demo hardening set.
  sandbox:
    enabled: true
    working_directory: /
    allowed_write_paths:
      - /
    allowed_templates:
      - pure_compute
      - file_read_only
      - file_read_write
      - network_outbound
      - unrestricted
    # Per-command root escalation. ``sudo`` asks the sandbox engine to prepend
    # ``sudo -n`` to the sandbox-exec argv so the kernel-sandboxed subprocess
    # briefly runs as UID 0. Only takes effect when the gateway advertises
    # INTENTFRAME_ESCALATION_ARMED=1 (set iff intentframe_setup_root_demo.sh
    # has installed /etc/sudoers.d/intentframe-run). Disarmed machines
    # silently run unprivileged, so this file is safe to ship.
    escalate: sudo

storage:
  database_path: null
  log_path: null

logging:
  level: INFO
  format: console
