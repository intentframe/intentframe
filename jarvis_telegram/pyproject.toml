[project]
name = "jarvis-telegram"
version = "0.1.0"
description = "Telegram bot that connects to the Jarvis API server over UDS"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
authors = [
    { name = "IntentFrame Contributors" },
]
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
jarvis-telegram = "jarvis_telegram.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_telegram"]
